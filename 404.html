<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#060608">
  <title>MERILIA - Page introuvable</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #060608;
      --t2: rgba(240, 240, 248, 0.75);
      --t3: rgba(220, 220, 230, 0.45);
      --silver-light: #e2e2ee;
      --silver-bright: #eeeef4;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: var(--bg); min-height: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      color: #fff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .orb {
      position: fixed;
      top: -15%;
      left: 50%;
      transform: translateX(-50%);
      width: clamp(320px, 80vw, 700px);
      height: clamp(320px, 80vw, 700px);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(160, 160, 190, 0.18) 0%, rgba(6, 6, 8, 0) 70%);
      filter: blur(80px);
      pointer-events: none;
    }
    h1 {
      position: relative;
      font-size: clamp(38px, 11vw, 56px);
      font-weight: 900;
      letter-spacing: 0.12em;
      background: linear-gradient(135deg, #888, var(--silver-bright), #fff, var(--silver-bright), #888);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }
    p {
      position: relative;
      font-size: 15px;
      font-weight: 300;
      font-style: italic;
      letter-spacing: 0.06em;
      color: var(--t2);
      margin-bottom: 32px;
    }
    a {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 48px;
      padding: 0 32px;
      border-radius: 50px;
      background: linear-gradient(135deg, #999, var(--silver-light), #fff, var(--silver-light), #999);
      color: var(--bg);
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.7);
      transition: transform 0.3s var(--ease);
    }
    a:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="orb" aria-hidden="true"></div>
  <h1>MERILIA</h1>
  <p>Cette page n'existe pas (ou plus).</p>
  <a href="/">RETOUR AU SITE</a>
</body>
</html>
